  api:
    build: 
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql://admin:super_secret_password@postgres:5432/tv_platform?schema=public"
      PORT: 4000
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "ru-1"
      S3_BUCKET: "${S3_BUCKET}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
    depends_on:
      - postgres
    volumes:
      - ./apps/tv-pwa/dist/videos-light:/apps/tv-pwa/public/videos-light:ro
    command: sh -c "npx prisma migrate deploy && npm start" # <-- ИСПРАВЛЕНО
    restart: always