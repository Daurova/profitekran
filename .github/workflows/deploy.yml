name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/profitekran
            
            # 1. Создаем .env с секретами S3
            cat > services/api/.env << EOF
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_REGION=ru-1
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            EOF

            # 2. Обновляем код
            git pull origin main
            
            # 3. Пересобираем фронтенд
            cd apps/tv-pwa
            npm install
            npm run build
            
            # 4. Возвращаем видео, если их нет
            if [ ! -d "dist/videos-light" ]; then
              mkdir -p dist/videos-light
              cp -r public/videos-light/* dist/videos-light/ 2>/dev/null || true
            fi
            
            # 5. Перезапускаем Docker
            cd ../..
            docker compose -f docker-compose.prod.yml up -d --build
            chmod -R 755 apps/tv-pwa/dist/videos-light
            docker compose -f docker-compose.prod.yml restart nginx