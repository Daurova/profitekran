name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- СБОРКА И ТЕСТЫ БЭКЕНДА (на GitHub) ---
      - name: Install API dependencies
        run: cd services/api && npm install

      - name: Generate Prisma Client
        run: cd services/api && npx prisma generate
        
      - name: Force install rolldown binding for CI
        run: cd services/api && npm install @rolldown/binding-linux-x64-gnu --no-save
      
      - name: Run Tests
        run: cd services/api && npm test

      # --- ДЕПЛОЙ И СБОРКА НА СЕРВЕРЕ ---
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/profitekran
            
            # 1. Создаем .env
            cat > .env << EOF
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_REGION=ru-1
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            # 2. Обновляем код
            git fetch --all
            git reset --hard origin/main
            
            # 3. Пересобираем PWA (телевизор)
            cd apps/tv-pwa
            npm install
            npm run build
            if [ ! -d "dist/videos-light" ]; then
              mkdir -p dist/videos-light
              cp -r public/videos-light/* dist/videos-light/ 2>/dev/null || true
            fi
            
            # 4. Собираем АДМИНКУ прямо на сервере
            cd ../admin
            npm install
            npm run build
            
            # 5. ПЕРЕСОБИРАЕМ ОБРАЗ API (без кэша, чтобы код точно обновился)
            cd ../..
            # Удаляем старый образ API, чтобы Docker точно собрал новый
            docker rmi profitekran-api:latest || true

            # Собираем новый образ
            docker compose -f docker-compose.prod.yml build --no-cache api
            
            # 6. УДАЛЯЕМ СТАРЫЙ КОНТЕЙНЕР NGINX (чтобы volume применились)
            docker compose -f docker-compose.prod.yml stop nginx || true
            docker compose -f docker-compose.prod.yml rm -f nginx || true
            
            # 7. ЗАПУСКАЕМ КОНТЕЙНЕРЫ
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            
            # 8. Перечитываем конфиг Nginx
            docker exec profitekran-nginx-1 nginx -s reload
            
            # 9. Ждем API и применяем миграции
            echo "Waiting for API..."
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy