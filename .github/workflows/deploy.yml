name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- СБОРКА БЭКЕНДА ---
      - name: Install API dependencies
        run: cd services/api && npm install

      - name: Generate Prisma Client
        run: cd services/api && npx prisma generate
        
      - name: Force install rolldown binding for CI
        run: cd services/api && npm install @rolldown/binding-linux-x64-gnu --no-save
      
      - name: Run Tests
        run: cd services/api && npm test

      # --- СБОРКА АДМИНКИ НА GITHUB ---
      - name: Install Admin dependencies
        run: cd apps/admin && npm install
        
      - name: Build Admin
        run: cd apps/admin && npm run build

      # --- КОПИРОВАНИЕ АДМИНКИ НА СЕРВЕР (без сборки на сервере) ---
      - name: Copy Admin to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "apps/admin/dist/*"
          target: "/var/www/profitekran/apps/tv-pwa/dist/admin"
          strip_components: 2
          overwrite: true
          rm: true # Очищаем старую папку перед копированием

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/profitekran
            
            # 1. Создаем .env с секретами S3
            cat > .env << EOF
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_REGION=ru-1
            S3_BUCKET=${{ secrets.S3_BUCKET }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            # 2. Обновляем код
            git pull origin main
            
            # 3. Пересобираем фронтенд (PWA)
            cd apps/tv-pwa
            npm install
            npm run build
            
            # 4. Возвращаем видео, если их нет
            if [ ! -d "dist/videos-light" ]; then
              mkdir -p dist/videos-light
              cp -r public/videos-light/* dist/videos-light/ 2>/dev/null || true
            fi
            
            # 5. Перезапускаем Docker
            cd ../..
            docker compose -f docker-compose.prod.yml up -d            
            
            # 6. Ждем, пока API полностью запустится
            echo "Waiting for API to be ready..."
            sleep 10
            
            # 7. Автоматический бейзлайнинг (Big Tech Way)
            docker compose -f docker-compose.prod.yml exec -T postgres psql -U admin -d tv_platform -c "SELECT 1 FROM information_schema.tables WHERE table_name = 'Content'" | grep -q 1 && \
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate resolve --applied 20261102135601_init || true
            
            docker compose -f docker-compose.prod.yml exec -T postgres psql -U admin -d tv_platform -c "SELECT 1 FROM information_schema.columns WHERE table_name = 'Content' AND column_name = 'dayparts'" | grep -q 1 && \
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate resolve --applied 20261102183637_add_dayparts || true

            docker compose -f docker-compose.prod.yml exec -T postgres psql -U admin -d tv_platform -c "SELECT 1 FROM information_schema.columns WHERE table_name = 'Content' AND column_name = 'tenantId'" | grep -q 1 && \
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate resolve --applied 20261104120000_add_tenant_id || true

            docker compose -f docker-compose.prod.yml exec -T postgres psql -U admin -d tv_platform -c "SELECT 1 FROM information_schema.tables WHERE table_name = 'Tenant'" | grep -q 1 && \
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate resolve --applied 20261104160000_add_saas_models || true
            
            # 8. Применяем миграции
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy