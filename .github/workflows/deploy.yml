name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/profitekran
            git pull origin main
            
            # 1. Пересобираем фронтенд
            cd apps/tv-pwa
            npm install
            npm run build
            
            # 2. Возвращаем видео на место (они не должны теряться)
            # Копируем их только если их нет, чтобы не перезаписывать новые
            if [ ! -d "dist/videos-light" ]; then
              mkdir -p dist/videos-light
              cp -r public/videos-light/* dist/videos-light/ 2>/dev/null || true
            fi
            
            # 3. Перезапускаем Docker
            cd ../..
            docker compose -f docker-compose.prod.yml up -d --build
            chmod -R 755 apps/tv-pwa/dist/videos-light
            docker compose -f docker-compose.prod.yml restart nginx