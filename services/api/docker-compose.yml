services:
  postgres:
    image: postgres:16-alpine
    # Убрали container_name, чтобы Docker сам дал уникальное имя
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: tv_platform
    ports:
      - "5433:5432" # Снаружи 5433, внутри 5432 (чтобы не конфликтовать)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: