<!DOCTYPE html>
<html>
<head><title>Тест загрузки</title></head>
<body>
  <h1>Простой тест</h1>
  <input type="file" id="fileInput" />
  <script>
    document.getElementById('fileInput').addEventListener('change', function(e) {
      alert('Файл выбран: ' + e.target.files[0].name);
    });
  </script>
</body>
</html>
