events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    
    server {
        listen 80;
        server_name profitekran.online www.profitekran.online;
        
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name profitekran.online www.profitekran.online;

        ssl_certificate /etc/letsencrypt/live/profitekran.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/profitekran.online/privkey.pem;

        # ЖЕСТКОЕ ПРАВИЛО ДЛЯ ВИДЕО (стоит первым!)
        location /videos-light/ {
            alias /usr/share/nginx/html/videos-light/;
            add_header Accept-Ranges none;
            try_files $uri =404;
        }

        # Правило для API
        location /api/ {
            proxy_pass http://api:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Все остальное (React)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
