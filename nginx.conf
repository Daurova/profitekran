events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 80;
        server_name profitekran.online www.profitekran.online;
        
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name profitekran.online www.profitekran.online;
        client_max_body_size 100M;
        ssl_certificate /etc/letsencrypt/live/profitekran.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/profitekran.online/privkey.pem;

        # Админка (ДОБАВЛЕНО)
        location = /admin {
            return 301 https://$host/admin/;
        }

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
        }

        # ЖЕСТКОЕ ПРАВИЛО ДЛЯ ВИДЕО
        location /videos-light/ {
            alias /usr/share/nginx/html/videos-light/;
            add_header Accept-Ranges none;
            try_files $uri =404;
        }

        # API
        location /api/ {
            proxy_pass http://api:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React (PWA)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}